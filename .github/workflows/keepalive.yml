name: Keep scheduled monitors active

on:
  schedule:
    - cron: '17 2 1 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keep-scheduled-monitors-active
  cancel-in-progress: true

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enregistrer l'activité mensuelle
        run: |
          date -u +'%Y-%m-%dT%H:%M:%SZ' > .github/last-activity
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/last-activity
          git commit -m 'chore: keep scheduled monitors active'
          git push
